        function toGermanNote(noteStr) {
            if (!noteStr) return "";
            let match = noteStr.match(/([A-G])([#b]?)([0-9])/);
            if (!match) return noteStr;
            let pitch = match[1];
            let acc = match[2];

            let germPitch = pitch;
            if (pitch === 'B') {
                if (acc === 'b') germPitch = 'B';
                else if (acc === '') germPitch = 'H';
            } else if (pitch === 'E' && acc === 'b') {
                germPitch = 'Es';
            } else if (pitch === 'A' && acc === 'b') {
                germPitch = 'As';
            } else if (pitch === 'D' && acc === 'b') {
                germPitch = 'Des';
            } else if (pitch === 'G' && acc === 'b') {
                germPitch = 'Ges';
            } else if (pitch === 'C' && acc === 'b') {
                germPitch = 'Ces';
            } else if (acc === '#') {
                if (pitch === 'A') germPitch = 'Ais';
                else if (pitch === 'C') germPitch = 'Cis';
                else if (pitch === 'D') germPitch = 'Dis';
                else if (pitch === 'F') germPitch = 'Fis';
                else if (pitch === 'G') germPitch = 'Gis';
            }
            return germPitch;
        }

                { name: "I", voices: [{role:"root", note:"D3"}, {role:"third", note:"F3"}, {role:"fifth", note:"A3"}, {role:"root", note:"D4"}] },
                { name: "IV", voices: [{role:"root", note:"G3"}, {role:"third", note:"Bb3"}, {role:"fifth", note:"D4"}, {role:"root", note:"G4"}] },
                { name: "V7", voices: [{role:"root", note:"A2"}, {role:"third", note:"C#3"}, {role:"fifth", note:"E3"}, {role:"seventh", note:"G3"}] },
                { name: "I", voices: [{role:"root", note:"D3"}, {role:"third", note:"F3"}, {role:"fifth", note:"A3"}, {role:"root", note:"D4"}] }
            ]},
            "G": { name: "g-moll", chords: [
                { name: "I", voices: [{role:"root", note:"G2"}, {role:"third", note:"Bb2"}, {role:"fifth", note:"D3"}, {role:"root", note:"G3"}] },
                { name: "IV", voices: [{role:"root", note:"C3"}, {role:"third", note:"Eb3"}, {role:"fifth", note:"G3"}, {role:"root", note:"C4"}] },
                { name: "V7", voices: [{role:"root", note:"D3"}, {role:"third", note:"F#3"}, {role:"fifth", note:"A3"}, {role:"seventh", note:"C4"}] },
                { name: "I", voices: [{role:"root", note:"G2"}, {role:"third", note:"Bb2"}, {role:"fifth", note:"D3"}, {role:"root", note:"G3"}] }
            ]}
        };

        function initVisualKeySelect() {
            const select = document.getElementById("visualKeySelect");
            select.innerHTML = "";
            cycleKeys.forEach(k => {
                let opt = document.createElement("option");
                opt.value = k;
                opt.innerText = cycleKeysGerman[k];
                if (k === "Bb") opt.selected = true;
                select.appendChild(opt);
            });
        }

        function updateVisualTable() {
            const mode = document.getElementById("visualModeSelect").value;
            const key = document.getElementById("visualKeySelect").value;
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const item = dataset[key];

            document.getElementById("visualKeyTitle").innerText = `調 : ${item.name}`;

            const tbody = document.getElementById("visualTableBody");
            tbody.innerHTML = "";

            // 下から順に 第1声部〜第4声部
            const partNames = ["第1声部 (低)", "第2声部", "第3声部", "第4声部 (高)"];

            for (let i = 0; i < 4; i++) {
                let tr = document.createElement("tr");

                let tdLabel = document.createElement("td");
                tdLabel.className = "role-label";
                tdLabel.innerText = partNames[i];
                tr.appendChild(tdLabel);

                item.chords.forEach(chord => {
                    let td = document.createElement("td");
                    let v = chord.voices[i];
                    td.className = getRoleClass(v.role);
                    let germ = toGermanNote(v.note);
                    td.innerHTML = `<div>${germ} <span style="font-size:0.75rem; opacity:0.8;">(${v.note.replace('b','♭').replace('#','♯')})</span></div>` +
                                   `<div style="font-size:0.7rem; margin-top:2px; font-weight:normal; opacity:0.9;">[${getRoleLabel(v.role)}]</div>`;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }
        }

        // ランダム練習用（実際の合奏で起きる変則ボイシングパターンを複数用意）
        const randomVoicingTemplates = [
            { name: "基本形 (根・3・5・7)", roles: ["root", "third", "fifth", "seventh"] },
            { name: "変則① (3 - 5 - 5 - 7)", roles: ["third", "fifth", "fifth", "seventh"] },
            { name: "変則② (根 - 3 - 3 - 根)", roles: ["root", "third", "third", "root"] },
            { name: "変則③ (根 - 5 - 根 - 3)", roles: ["root", "fifth", "root", "third"] },
            { name: "変則④ (5 - 根 - 3 - 5)", roles: ["fifth", "root", "third", "fifth"] }
        ];

        function generateRandomVoice() {
            const keys = Object.keys(dataDur);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const mode = Math.random() < 0.5 ? "dur" : "moll";
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const item = dataset[randomKey];

            const chordIndices = [0, 1, 2, 3]; // I, IV, V7, I
            const chordIndex = chordIndices[Math.floor(Math.random() * chordIndices.length)];
            const chordObj = item.chords[chordIndex];

            // 基準となるコードの構成音から、役割ごとの代表的な音を抽出
            let roleToNotes = {};
            chordObj.voices.forEach(v => {
                if (!roleToNotes[v.role]) roleToNotes[v.role] = [];
                roleToNotes[v.role].push(v.note);
            });
            // 7音がないコード(Iなど)で7音が指定された場合のフォールバック
            if (!roleToNotes["seventh"]) {
                roleToNotes["seventh"] = [chordObj.voices[chordObj.voices.length - 1].note];
            }

            // ランダムなテンプレートを選択
            const template = randomVoicingTemplates[Math.floor(Math.random() * randomVoicingTemplates.length)];

            document.getElementById("randomCondition").innerText = 
                `【出題】 ${item.name} ＞ ${chordObj.name}和音 ｜ パターン: ${template.name}`;

            const display = document.getElementById("voiceDisplay");
            display.innerHTML = "";

            const partLabels = ["第1声部 (低)", "第2声部", "第3声部", "第4声部 (高)"];

            template.roles.forEach((role, idx) => {
                let availableNotes = roleToNotes[role] || roleToNotes["root"];
                let chosenNote = availableNotes[Math.floor(Math.random() * availableNotes.length)];
                let germ = toGermanNote(chosenNote);

                let card = document.createElement("div");
                card.className = `voice-card ${getRoleClass(role)}`;
                card.innerHTML = `
                    <div class="voice-part">${partLabels[idx]}</div>
                    <div class="voice-note">${germ} <span style="font-size:0.8rem;">(${chosenNote.replace('b','♭').replace('#','♯')})</span></div>
                    <div style="font-size:0.75rem; margin-top:4px;">[${getRoleLabel(role)}]</div>
                `;
                display.appendChild(card);
            });
        }

        initVisualKeySelect();
        updateVisualTable();
        generateRandomVoice();
    </script>
</body>
</html>
