<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管楽器ハーモニー・カデンツ トレーナー</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 20px; background: #f4f4f9; padding-bottom: 50px; }
        select, button, input { font-size: 1rem; padding: 6px 10px; margin: 5px; }
        .section { background: white; margin: 15px auto; padding: 15px; border-radius: 10px; max-width: 800px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-btn { background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .main-btn:hover { background: #218838; }
        
        .random-box { background: #e7f1ff; border: 2px solid #0056b3; border-radius: 8px; padding: 15px; margin-top: 10px; }
        .random-display { font-size: 1.8rem; font-weight: bold; color: #004085; margin: 10px 0; }
        .random-sub { font-size: 1rem; color: #333; margin: 5px 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #e7f1ff; color: #004085; }
        tr:nth-child(even) { background: #fafafa; }

        /* スライド風ビジュアル表のスタイル（色は問わずシンプルに音名を表示） */
        .slide-table { margin-top: 15px; }
        .slide-table th { background: #f8f9fa; color: #333; border: 1px solid #ccc; font-size: 1rem; }
        .slide-table td { border: 1px solid #ccc; font-size: 1.1rem; height: 40px; color: #333; background: #fff; }

        #tunerDisplay { font-size: 1.5rem; font-weight: bold; margin: 5px 0; color: #333; }
        #centsDisplay { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .flex-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>管楽器ハーモニー・カデンツ トレーナー</h1>

    <!-- ① ランダム練習セクション -->
    <div class="section">
        <h2>ランダム練習課題（自動出題）</h2>
        <div>
            <label>対象モード: </label>
            <select id="randomModeSelect">
                <option value="both">dur と moll 両方</option>
                <option value="dur">dur (長調) のみ</option>
                <option value="moll">moll (短調) のみ</option>
            </select>
        </div>
        <button class="main-btn" onclick="generateRandomTask()" style="font-size: 1.2rem; padding: 10px 20px;">🎲 ランダムに課題を出す</button>
        
        <div class="random-box" id="randomBox" style="display: none;">
            <div class="random-sub" id="randKeyMode">--</div>
            <div class="random-display" id="randNote">--</div>
            <div class="random-sub" id="randRole">--</div>
            <button class="main-btn" onclick="playCurrentRandomTone()" style="margin-top: 10px;">この基準音を鳴らす</button>
        </div>
    </div>

    <!-- ② スライド風 カデンツ・ビジュアル表 -->
    <div class="section">
        <h2>カデンツ・ビジュアル確認</h2>
        <div style="margin-bottom: 10px;">
            <label>調の選択: </label>
            <select id="visualModeSelect" onchange="updateVisualTable()">
                <option value="dur">dur (長調)</option>
                <option value="moll">moll (短調)</option>
            </select>
            <select id="visualKeySelect" onchange="updateVisualTable()">
                <!-- JSで動的に生成 -->
            </select>
        </div>
        <h3 id="visualKeyTitle" style="margin: 5px 0 10px 0; color: #004085;">調 : --</h3>
        <div style="overflow-x: auto;">
            <table class="slide-table" id="visualTable">
                <thead>
                    <tr>
                        <th>I (主和音)</th>
                        <th>IV (下属音)</th>
                        <th>V (属音)</th>
                        <th>I (解決)</th>
                    </tr>
                </thead>
                <tbody id="visualTableBody"></tbody>
            </table>
        </div>
        <button class="main-btn" onclick="playCurrentVisualCadence()" style="margin-top: 10px;">このカデンツを聴く</button>
    </div>

    <!-- ③ カデンツ一覧リストセクション -->
    <div class="section">
        <h2>カデンツ一覧（完全4度循環）</h2>
        <div>
            <label>表示モード: </label>
            <select id="modeSelect" onchange="updateTable()">
                <option value="dur">dur (長調)</option>
                <option value="moll">moll (短調)</option>
            </select>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="cadenceTable">
                <thead>
                    <tr>
                        <th>調 (Key)</th>
                        <th>I (主和音)</th>
                        <th>IV (下属音)</th>
                        <th>V (属音)</th>
                        <th>I (解決)</th>
                        <th>試聴</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ④ チューナー＆メトロノームセクション -->
    <div class="flex-container">
        <div class="section" style="flex: 1; min-width: 300px;">
            <h2>チューナー</h2>
            <div>
                <label>基準ピッチ: </label>
                <button id="pitch440Btn" onclick="setA4(440)" style="background:#007bff; color:white; border:none; border-radius:4px;">440 Hz</button>
                <button id="pitch442Btn" onclick="setA4(442)" style="background:#ccc; color:black; border:none; border-radius:4px;">442 Hz</button>
            </div>
            <button class="main-btn" onclick="startTuner()" style="margin-top:10px;">マイク起動</button>
            <div id="tunerDisplay">-- Hz</div>
            <div id="centsDisplay">音名: --</div>
        </div>

        <div class="section" style="flex: 1; min-width: 300px;">
            <h2>メトロノーム</h2>
            <div>
                <label>テンポ (BPM): </label>
                <input type="number" id="tempoInput" value="70" min="40" max="240" style="width: 60px; text-align:center;">
            </div>
            <div style="margin: 10px 0;">
                <button class="main-btn" id="metroBtn" onclick="toggleMetronome()">メトロノーム開始</button>
            </div>
        </div>
    </div>

    <script>
        let A4_FREQ = 440;

        function setA4(freq) {
            A4_FREQ = freq;
            document.getElementById("pitch440Btn").style.background = (freq === 440) ? "#007bff" : "#ccc";
            document.getElementById("pitch440Btn").style.color = (freq === 440) ? "white" : "black";
            document.getElementById("pitch442Btn").style.background = (freq === 442) ? "#007bff" : "#ccc";
            document.getElementById("pitch442Btn").style.color = (freq === 442) ? "white" : "black";
        }

        function getFreq(noteName) {
            const baseFreqs = {
                "C3": 130.81, "C#3": 138.59, "Db3": 138.59, "D3": 146.83, "D#3": 155.56, "Eb3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "Gb3": 185.00, "G3": 196.00, "G#3": 207.65, "Ab3": 207.65, "A3": 220.00, "A#3": 233.08, "Bb3": 233.08, "B3": 246.94,
                "C4": 261.63, "C#4": 277.18, "Db4": 277.18, "D4": 293.66, "D#4": 311.13, "Eb4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "Gb4": 369.99, "G4": 392.00, "G#4": 415.30, "Ab4": 415.30, "A4": 440.00, "A#4": 466.16, "Bb4": 466.16, "B4": 493.88,
                "C5": 523.25, "C#5": 554.37, "Db5": 554.37, "D5": 587.33, "D#5": 622.25, "Eb5": 622.25, "E5": 659.25, "F5": 698.46, "F#5": 739.99, "Gb5": 739.99, "G5": 783.99, "G#5": 830.61, "Ab5": 830.61, "A5": 880.00, "A#5": 932.33, "Bb5": 932.33, "B5": 987.77,
                "C6": 1046.50, "Db6": 1108.73, "D6": 1174.66, "Eb6": 1244.51, "E6": 1318.51, "F6": 1396.91, "Gb6": 1479.98, "G6": 1567.98, "Ab6": 1661.22, "A6": 1760.00, "Bb6": 1864.66, "B6": 1975.54
            };
            let std = baseFreqs[noteName];
            if (!std) return 440;
            return std * (A4_FREQ / 440);
        }

        const cycleKeys = ["C", "F", "Bb", "Eb", "Ab", "Db", "Gb", "B", "E", "A", "D", "G"];

        const dataDur = {
            "C":  { name: "C-dur",  chords: [["E5","C5","G4","C4"], ["F5","C5","A4","F3"], ["G5","D5","G4","G3"], ["E5","C5","G4","C4"]] },
            "F":  { name: "F-dur",  chords: [["A5","F5","C5","F3"], ["Bb5","F5","D5","Bb3"], ["C6","G5","C5","C3"], ["A5","F5","C5","F3"]] },
            "Bb": { name: "B♭-dur", chords: [["D5","Bb4","F4","Bb3"], ["Eb5","Bb4","G4","Eb3"], ["F5","A4","F4","F3"], ["D5","Bb4","F4","Bb3"]] },
            "Eb": { name: "E♭-dur", chords: [["G5","Eb5","Bb4","Eb3"], ["Ab5","Eb5","C5","Ab3"], ["Bb5","F5","Bb4","Bb3"], ["G5","Eb5","Bb4","Eb3"]] },
            "Ab": { name: "A♭-dur", chords: [["C6","Ab5","Eb5","Ab3"], ["Db6","Ab5","F5","Db3"], ["Eb6","Bb5","Eb5","Eb3"], ["C6","Ab5","Eb5","Ab3"]] },
            "Db": { name: "D♭-dur", chords: [["F5","Db5","Ab4","Db4"], ["Gb5","Db5","Bb4","Gb3"], ["Ab5","Eb5","Ab4","Ab3"], ["F5","Db5","Ab4","Db4"]] },
            "Gb": { name: "G♭-dur", chords: [["Bb5","Gb5","Db5","Gb3"], ["Cb6","Gb5","Eb5","Cb3"], ["Db6","Ab5","Db5","Db3"], ["Bb5","Gb5","Db5","Gb3"]] },
            "B":  { name: "H-dur",  chords: [["D#6","B5","F#5","B3"], ["E6","B5","G#5","E3"], ["F#6","C#6","F#5","F#3"], ["D#6","B5","F#5","B3"]] },
            "E":  { name: "E-dur",  chords: [["G#5","E5","B4","E3"], ["A5","E5","C#5","A3"], ["B5","F#5","B4","B3"], ["G#5","E5","B4","E3"]] },
            "A":  { name: "A-dur",  chords: [["C#6","A5","E5","A3"], ["D6","A5","F#5","D3"], ["E6","B5","E5","E3"], ["C#6","A5","E5","A3"]] },
            "D":  { name: "D-dur",  chords: [["F#5","D5","A4","D4"], ["G5","D5","B4","G3"], ["A5","E5","A4","A3"], ["F#5","D5","A4","D4"]] },
            "G":  { name: "G-dur",  chords: [["B5","G5","D5","G3"], ["C6","G5","E5","C3"], ["D6","A5","D5","D3"], ["B5","G5","D5","G3"]] }
        };

        const dataMoll = {
            "C":  { name: "C-moll",  chords: [["Eb5","C5","G4","C4"], ["F5","C5","Ab4","F3"], ["G5","D5","G4","G3"], ["Eb5","C5","G4","C4"]] },
            "F":  { name: "F-moll",  chords: [["Ab5","F5","C5","F3"], ["Bb5","F5","Db5","Bb3"], ["C6","G5","C5","C3"], ["Ab5","F5","C5","F3"]] },
            "Bb": { name: "B♭-moll", chords: [["Db5","Bb4","F4","Bb3"], ["Eb5","Bb4","Gb4","Eb3"], ["F5","A4","F4","F3"], ["Db5","Bb4","F4","Bb3"]] },
            "Eb": { name: "E♭-moll", chords: [["Gb5","Eb5","Bb4","Eb3"], ["Ab5","Eb5","Cb5","Ab3"], ["Bb5","D5","Bb4","Bb3"], ["Gb5","Eb5","Bb4","Eb3"]] },
            "Ab": { name: "A♭-moll", chords: [["Cb6","Ab5","Eb5","Ab3"], ["Db6","Ab5","Fb5","Db3"], ["Eb5","Bb4","Eb5","Eb3"], ["Cb6","Ab5","Eb5","Ab3"]] },
            "Db": { name: "D♭-moll", chords: [["Fb5","Db5","Ab4","Db4"], ["Gb5","Db5","Bbb4","Gb3"], ["Ab5","C5","Ab4","Ab3"], ["Fb5","Db5","Ab4","Db4"]] },
            "Gb": { name: "G♭-moll", chords: [["Bbb5","Gb5","Db5","Gb3"], ["Cb6","Gb5","Ebb5","Cb3"], ["Db5","F5","Db5","Db3"], ["Bbb5","Gb5","Db5","Gb3"]] },
            "B":  { name: "H-moll",  chords: [["D6","B5","F#5","B3"], ["E6","B5","G5","E3"], ["F#6","A#5","F#5","F#3"], ["D6","B5","F#5","B3"]] },
            "E":  { name: "E-moll",  chords: [["G5","E5","B4","E3"], ["A5","E5","C5","A3"], ["B5","D#5","B4","B3"], ["G5","E5","B4","E3"]] },
            "A":  { name: "A-moll",  chords: [["C6","A5","E5","A3"], ["D6","A5","F5","D3"], ["E6","G#5","E5","E3"], ["C6","A5","E5","A3"]] },
            "D":  { name: "D-moll",  chords: [["F5","D5","A4","D4"], ["G5","D5","Bb4","G3"], ["A5","C#5","A4","A3"], ["F5","D5","A4","D4"]] },
            "G":  { name: "G-moll",  chords: [["Bb5","G5","D5","G3"], ["C6","G5","Eb5","C3"], ["D6","F#5","D5","D3"], ["Bb5","G5","D5","G3"]] }
        };

        function initVisualKeySelect() {
            const select = document.getElementById("visualKeySelect");
            select.innerHTML = "";
            cycleKeys.forEach(k => {
                let opt = document.createElement("option");
                opt.value = k;
                opt.innerText = k;
                if (k === "Bb") opt.selected = true;
                select.appendChild(opt);
            });
        }

        function updateVisualTable() {
            const mode = document.getElementById("visualModeSelect").value;
            const key = document.getElementById("visualKeySelect").value;
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const item = dataset[key];

            document.getElementById("visualKeyTitle").innerText = `調 : ${item.name}`;

            const tbody = document.getElementById("visualTableBody");
            tbody.innerHTML = "";

            for (let v = 0; v < 4; v++) {
                let tr = document.createElement("tr");
                for (let c = 0; c < 4; c++) {
                    let td = document.createElement("td");
                    let note = item.chords[c][v];
                    td.innerText = note.replace("b", "♭").replace("#", "♯");
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function playCurrentVisualCadence() {
            const mode = document.getElementById("visualModeSelect").value;
            const key = document.getElementById("visualKeySelect").value;
            playCadenceSequence(key, mode);
        }

        let currentRandomTask = null;

        function generateRandomTask() {
            const modeChoice = document.getElementById("randomModeSelect").value;
            let availableModes = [];
            if (modeChoice === "both" || modeChoice === "dur") availableModes.push("dur");
            if (modeChoice === "both" || modeChoice === "moll") availableModes.push("moll");

            const selectedMode = availableModes[Math.floor(Math.random() * availableModes.length)];
            const dataset = (selectedMode === "dur") ? dataDur : dataMoll;
            
            const randomKeyKey = cycleKeys[Math.floor(Math.random() * cycleKeys.length)];
            const item = dataset[randomKeyKey];

            const chordIndex = Math.floor(Math.random() * 4);
            const chordNames = selectedMode === "dur" ? ["I (主和音)", "IV (下属音)", "V (属音)", "I (解決)"] : ["i (主和音)", "iv (下属音)", "V (属音)", "i (解決)"];
            
            const voiceIndex = Math.floor(Math.random() * 4);
            const voiceNames = ["トップ声部 (Soprano)", "内声 1 (Alto)", "内声 2 (Tenor)", "ベース声部 (Bass)"];

            const noteName = item.chords[chordIndex][voiceIndex];

            currentRandomTask = { noteName: noteName };

            document.getElementById("randomBox").style.display = "block";
            document.getElementById("randKeyMode").innerText = `調: ${item.name} ｜ 声部: ${voiceNames[voiceIndex]}`;
            document.getElementById("randNote").innerText = noteName.replace("b", "♭").replace("#", "♯");
            document.getElementById("randRole").innerText = `コード: ${chordNames[chordIndex]} の構成音`;

            playCurrentRandomTone();
        }

        function playCurrentRandomTone() {
            if (!currentRandomTask) return;
            const ctx = getAudioContext();
            const freq = getFreq(currentRandomTask.noteName);
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);

            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.5);
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playChord(notes) {
            const ctx = getAudioContext();
            notes.forEach(noteName => {
                const freq = getFreq(noteName);
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);

                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            });
        }

        function playCadenceSequence(key, mode) {
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const chords = dataset[key].chords;
            let delay = 0;
            chords.forEach(chordNotes => {
                setTimeout(() => playChord(chordNotes), delay);
                delay += 1000;
            });
        }

        function updateTable() {
            const mode = document.getElementById("modeSelect").value;
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            cycleKeys.forEach(k => {
                const item = dataset[k];
                let tr = document.createElement("tr");

                let tdKey = document.createElement("td");
                tdKey.style.fontWeight = "bold";
                tdKey.innerText = item.name;
                tr.appendChild(tdKey);

                item.chords.forEach(chordNotes => {
                    let tdChord = document.createElement("td");
                    tdChord.innerHTML = chordNotes.map(n => n.replace("b","♭").replace("#","♯")).join("<br>");
                    tr.appendChild(tdChord);
                });

                let tdPlay = document.createElement("td");
                let btn = document.createElement("button");
                btn.className = "main-btn";
                btn.innerText = "聴く";
                btn.style.padding = "4px 8px";
                btn.onclick = () => playCadenceSequence(k, mode);
                tdPlay.appendChild(btn);
                tr.appendChild(tdPlay);

                tbody.appendChild(tr);
            });
        }

        let metronomeTimer = null;
        let isMetronomeRunning = false;

        function toggleMetronome() {
            const btn = document.getElementById("metroBtn");
            const bpm = parseInt(document.getElementById("tempoInput").value) || 70;

            if (isMetronomeRunning) {
                clearInterval(metronomeTimer);
                isMetronomeRunning = false;
                btn.innerText = "メトロノーム開始";
                btn.style.background = "#28a745";
            } else {
                const ctx = getAudioContext();
                const interval = (60 / bpm) * 1000;
                
                metronomeTimer = setInterval(() => {
                    playClick(ctx);
                }, interval);
                isMetronomeRunning = true;
                btn.innerText = "停止";
                btn.style.background = "#dc3545";
            }
        }

        function playClick(ctx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        }

        async function startTuner() {
            try {
                const ctx = getAudioContext();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                const buffer = new Float32Array(analyser.fftSize);
                function updatePitch() {
                    analyser.getFloatTimeDomainData(buffer);
                    let freq = autoCorrelate(buffer, ctx.sampleRate);
                    if (freq !== -1) {
                        document.getElementById("tunerDisplay").innerText = freq.toFixed(1) + " Hz";
                        let noteInfo = freqToNote(freq);
                        
                        let advice = "";
                        if (noteInfo.cents > 2) {
                            advice = `<span style="color: #dc3545;">+${noteInfo.cents} ¢ (高い ➔ ${noteInfo.cents}セント下げる)</span>`;
                        } else if (noteInfo.cents < -2) {
                            advice = `<span style="color: #0056b3;">${noteInfo.cents} ¢ (低い ➔ ${Math.abs(noteInfo.cents)}セント上げる)</span>`;
                        } else {
                            advice = `<span style="color: #28a745;">±0 ¢ (ピッタシ！)</span>`;
                        }

                        document.getElementById("centsDisplay").innerHTML = `音名: ${noteInfo.name} ｜ ${advice}`;
                    }
                    requestAnimationFrame(updatePitch);
                }
                updatePitch();
            } catch (err) {
                alert("マイクの許可が必要です。");
            }
        }

        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length, sum = 0;
            for(let i=0; i<SIZE; i++) sum += buffer[i] * buffer[i];
            if (Math.sqrt(sum/SIZE) < 0.01) return -1;
            let r1=0, r2=SIZE-1, threshold=0.2;
            for(let i=0; i<SIZE/2; i++) if(Math.abs(buffer[i])<threshold){r1=i; break;}
            for(let i=1; i<SIZE/2; i++) if(Math.abs(buffer[SIZE-i])<threshold){r2=SIZE-i; break;}
            let buf = buffer.slice(r1, r2), c = new Array(buf.length).fill(0);
            for (let i=0; i<buf.length; i++) for (let j=0; j<buf.length-i; j++) c[i] += buf[j]*buf[j+i];
            let d=0; while(c[d]>c[d+1]) d++;
            let maxval=-1, maxpos=-1;
            for(let i=d; i<buf.length; i++) if(c[i]>maxval){maxval=c[i]; maxpos=i;}
            return sampleRate/maxpos;
        }

        function freqToNote(freq) {
            const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            let midiNum = Math.round(12 * (Math.log2(freq / A4_FREQ))) + 69;
            let noteName = noteNames[midiNum % 12].replace("#", "♯");
            let octave = Math.floor(midiNum / 12) - 1;
            let idealFreq = A4_FREQ * Math.pow(2, (midiNum - 69) / 12);
            let cents = Math.round(1200 * Math.log2(freq / idealFreq));
            return { name: noteName + octave, cents: cents };
        }

        initVisualKeySelect();
        updateVisualTable();
        updateTable();
    </script>
