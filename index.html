<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハーモニー練習</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ハーモニー練習</h1>

    <!-- ランダム実践トレーニング -->
    <div class="section">
        <div class="settings-box">
            <label><strong>【進行・調選択】</strong></label><br>
            <select id="randModeSelect" onchange="onRandSettingChange()" style="margin-top: 5px;">
                <option value="dur">長調 カデンツ</option>
                <option value="moll">短調 カデンツ</option>
                <option value="parallel">スケール練習α</option>
                <option value="kanon">カノン進行 (長調)</option>
            </select>
            <select id="randKeySelect" onchange="onRandSettingChange()" style="margin-top: 5px;">
                <!-- JSで動的生成 -->
            </select>
        </div>

        <div class="random-box">
            <div id="randomCondition" style="font-weight: bold; color: #1c7ed6; font-size: 1.1rem; margin-bottom: 5px;">調名</div>
            <div class="voice-display" id="voiceDisplay">
                <!-- JSで動的生成 -->
            </div>
            <button class="main-btn" onclick="if(window.confirm('別のパターンを作成してもいいですか？')){generateRandomCadenceNotes();}" style="font-size: 1rem; padding: 10px 20px; width: 100%; max-width: 300px;">新規パターン作成</button>
        </div>
    </div>

    <!-- カデンツ・マトリクス確認 -->
    <div class="section">
        <h2 style="font-size: 1.2rem;">マトリクス表確認</h2>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 0.9rem;">進行・調: </label><br>
            <select id="visualModeSelect" onchange="updateVisualTable()" style="margin-top: 5px;">
                <option value="dur">長調 カデンツ</option>
                <option value="moll">短調 カデンツ</option>
                <option value="kanon">カノン進行 (長調)</option>
            </select>
            <select id="visualKeySelect" onchange="updateVisualTable()" style="margin-top: 5px;">
                <!-- JSで動的に生成 -->
            </select>
        </div>
        <h3 id="visualKeyTitle" style="margin: 5px 0 10px 0; color: #004085; font-size: 1.05rem;">調 : --</h3>
        <div class="table-container">
            <table class="matrix-table" id="visualTable">
                <thead>
                    <tr id="visualTableHeadRow">
                        <!-- JSで動的生成 -->
                    </tr>
                </thead>
                <tbody id="visualTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
