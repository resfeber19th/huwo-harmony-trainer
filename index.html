<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ハーモニー・カデンツ チューナー</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #f4f4f9; }
        select { font-size: 1.2rem; padding: 5px 10px; margin: 10px; }
        .grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .chord-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 110px; }
        .note-btn { 
            background: #e7f1ff; border: 1px solid #b8daff; color: #004085; 
            padding: 6px 10px; margin: 4px 0; width: 100%; border-radius: 4px; 
            cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        .note-btn:hover { background: #b8daff; }
        .play-all-btn { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .play-all-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <h1>管楽器カデンツ & チューナー</h1>

    <!-- 調の選択 -->
    <label>調 (Key): </label>
    <select id="keySelect" onchange="updateCadence()">
        <option value="Bb">B♭ Major</option>
        <option value="F">F Major</option>
        <option value="Eb">E♭ Major</option>
    </select>
    <br>
    <button class="play-all-btn" onclick="playCadenceSequence()">カデンツを続けて聴く</button>

    <!-- カデンツ表示エリア -->
    <div class="grid" id="cadenceDisplay"></div>

    <script>
        // 音名から周波数（Hz）を計算するための定義（コンサートピッチ 440Hz基準）
        const noteFrequencies = {
            "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13, "E4": 329.63, "F4": 352.00, "F#4": 369.99, "G4": 392.00, "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88,
            "C5": 523.25, "D5": 587.33, "E5": 659.25, "F5": 698.46, "G5": 783.99, "A5": 880.00, "B5": 987.77,
            // 少し低いオクターブも必要に応じて
            "Bb3": 233.08, "C4": 261.63, "D4": 293.66, "Eb4": 311.13, "F4": 349.23, "G4": 392.00, "Ab4": 415.30, "A4": 440.00, "Bb4": 466.16,
            "C5": 523.25, "D5": 587.33, "Eb5": 622.25, "F5": 698.46, "G5": 783.99, "Ab5": 830.61, "Bb5": 932.33
        };

        // 各キーにおける滑らかな声部連結のデータ (例: 4声部 [トップ, アルト, テナー, バス])
        const cadenceData = {
            "Bb": {
                name: "B♭ Major",
                chords: [
                    { name: "I (B♭)", notes: ["D5", "Bb4", "F4", "Bb3"] },
                    { name: "IV (E♭)", notes: ["Eb5", "Bb4", "G4", "Eb3"] },
                    { name: "V (F)",  notes: ["F5", "A4", "F4", "F3"] },
                    { name: "I (B♭)", notes: ["D5", "Bb4", "F4", "Bb3"] }
                ]
            },
            "F": {
                name: "F Major",
                chords: [
                    { name: "I (F)",  notes: ["A4", "F4", "C4", "F3"] },
                    { name: "IV (B♭)", notes: ["Bb4", "F4", "D4", "Bb3"] },
                    { name: "V (C)",  notes: ["C5", "E4", "G4", "C3"] },
                    { name: "I (F)",  notes: ["A4", "F4", "C4", "F3"] }
                ]
            },
            "Eb": {
                name: "E♭ Major",
                chords: [
                    { name: "I (E♭)", notes: ["G4", "Eb4", "Bb3", "Eb3"] },
                    { name: "IV (A♭)", notes: ["Ab4", "Eb4", "C4", "Ab3"] },
                    { name: "V (B♭)", notes: ["Bb4", "D4", "F4", "Bb3"] },
                    { name: "I (E♭)", notes: ["G4", "Eb4", "Bb3", "Eb3"] }
                ]
            }
        };

        // Web Audio APIの初期化
        let audioCtx = null;

        function playTone(noteName, duration = 1.0) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const freq = noteFrequencies[noteName];
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // 管楽器っぽい柔らかい音にするため 'sine' または 'triangle' を使う
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // 音のフェードイン・フェードアウト（プチッというノイズを防ぐ）
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function updateCadence() {
            const selectedKey = document.getElementById("keySelect").value;
            const data = cadenceData[selectedKey];
            const display = document.getElementById("cadenceDisplay");
            
            display.innerHTML = "";

            data.chords.forEach(chord => {
                let box = document.createElement("div");
                box.className = "chord-box";
                box.innerHTML = `<h3>${chord.name}</h3>`;
                
                chord.notes.forEach(note => {
                    // フラットやシャープを見やすく整形（例: "Bb" -> "B♭"）
                    let displayName = note.replace("b", "♭").replace("#", "♯").slice(0, -1);
                    let btn = document.createElement("button");
                    btn.className = "note-btn";
                    btn.innerText = displayName;
                    // ボタンを押したらその音が鳴る
                    btn.onclick = () => playTone(note, 1.5);
                    box.appendChild(btn);
                });

                display.appendChild(box);
            });
        }

        // カデンツ全体を順番に鳴らす機能
        function playCadenceSequence() {
            const selectedKey = document.getElementById("keySelect").value;
            const data = cadenceData[selectedKey];
            let delay = 0;

            data.chords.forEach((chord, index) => {
                setTimeout(() => {
                    chord.notes.forEach(note => {
                        playTone(note, 1.2);
                    });
                }, delay);
                delay += 1200; // 次のコードまでの間隔（ミリ秒）
            });
        }

        // 初期表示
        updateCadence();
    </script>

</body>
</html>
