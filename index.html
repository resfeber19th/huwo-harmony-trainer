        function toGermanNote(noteStr) {
            if (!noteStr) return "";
            let match = noteStr.match(/([A-G])([#b]?)([0-9])/);
            if (!match) return noteStr;
            let pitch = match[1];
            let acc = match[2];

            let germPitch = pitch;
            if (pitch === 'B') {
                if (acc === 'b') germPitch = 'B';
                else if (acc === '') germPitch = 'H';
            } else if (pitch === 'E' && acc === 'b') {
                germPitch = 'Es';
            } else if (pitch === 'A' && acc === 'b') {
                germPitch = 'As';
            } else if (pitch === 'D' && acc === 'b') {
                germPitch = 'Des';
            } else if (pitch === 'G' && acc === 'b') {
                germPitch = 'Ges';
            } else if (pitch === 'C' && acc === 'b') {
                germPitch = 'Ces';
            } else if (acc === '#') {
                if (pitch === 'A') germPitch = 'Ais';
                else if (pitch === 'C') germPitch = 'Cis';
                else if (pitch === 'D') germPitch = 'Dis';
                else if (pitch === 'F') germPitch = 'Fis';
                else if (pitch === 'G') germPitch = 'Gis';
            }
            return germPitch;
        }

                { name: "I", voices: [{role:"root", note:"D3"}, {role:"third", note:"F3"}, {role:"fifth", note:"A3"}, {role:"empty", note:""}] },
                { name: "IV", voices: [{role:"root", note:"G3"}, {role:"third", note:"Bb3"}, {role:"fifth", note:"D4"}, {role:"empty", note:""}] },
                { name: "V7", voices: [{role:"root", note:"A2"}, {role:"third", note:"C#3"}, {role:"fifth", note:"E3"}, {role:"seventh", note:"G3"}] },
                { name: "I", voices: [{role:"root", note:"D3"}, {role:"third", note:"F3"}, {role:"fifth", note:"A3"}, {role:"empty", note:""}] }
            ]},
            "G": { name: "g-moll", chords: [
                { name: "I", voices: [{role:"root", note:"G2"}, {role:"third", note:"Bb2"}, {role:"fifth", note:"D3"}, {role:"empty", note:""}] },
                { name: "IV", voices: [{role:"root", note:"C3"}, {role:"third", note:"Eb3"}, {role:"fifth", note:"G3"}, {role:"empty", note:""}] },
                { name: "V7", voices: [{role:"root", note:"D3"}, {role:"third", note:"F#3"}, {role:"fifth", note:"A3"}, {role:"seventh", note:"C4"}] },
                { name: "I", voices: [{role:"root", note:"G2"}, {role:"third", note:"Bb2"}, {role:"fifth", note:"D3"}, {role:"empty", note:""}] }
            ]}
        };

        function initKeySelects() {
            const randSelect = document.getElementById("randKeySelect");
            randSelect.innerHTML = '<option value="">-- 調を選択 --</option>';
            cycleKeys.forEach(k => {
                let opt = document.createElement("option");
                opt.value = k;
                opt.innerText = cycleKeysGerman[k];
                randSelect.appendChild(opt);
            });

            const visSelect = document.getElementById("visualKeySelect");
            visSelect.innerHTML = "";
            cycleKeys.forEach(k => {
                let opt = document.createElement("option");
                opt.value = k;
                opt.innerText = cycleKeysGerman[k];
                if (k === "Bb") opt.selected = true;
                visSelect.appendChild(opt);
            });
        }

        function updateVisualTable() {
            const mode = document.getElementById("visualModeSelect").value;
            const key = document.getElementById("visualKeySelect").value;
            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const item = dataset[key];

            document.getElementById("visualKeyTitle").innerText = `調 : ${item.name}`;

            const tbody = document.getElementById("visualTableBody");
            tbody.innerHTML = "";

            // 上から順（第4声部〜第1声部）に逆順変更
            const partNames = ["第4声部 (高)", "第3声部", "第2声部", "第1声部 (低)"];

            for (let i = 3; i >= 0; i--) {
                let tr = document.createElement("tr");

                let tdLabel = document.createElement("td");
                tdLabel.className = "role-label";
                tdLabel.innerText = partNames[3 - i];
                tr.appendChild(tdLabel);

                item.chords.forEach(chord => {
                    let td = document.createElement("td");
                    let v = chord.voices[i];
                    td.className = getRoleClass(v.role);
                    
                    if (v.role === 'empty') {
                        td.innerHTML = `<div style="color: #adb5bd;">-</div><div style="font-size:0.7rem; margin-top:2px; font-weight:normal;">[空白]</div>`;
                    } else {
                        let germ = toGermanNote(v.note);
                        td.innerHTML = `<div>${germ} <span style="font-size:0.75rem; opacity:0.8;">(${v.note.replace('b','♭').replace('#','♯')})</span></div>` +
                                       `<div style="font-size:0.7rem; margin-top:2px; font-weight:normal; opacity:0.9;">[${getRoleLabel(v.role)}]</div>`;
                    }
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }
        }

        const randomVoicingTemplates = [
            { roles: ["root", "third", "fifth", "seventh"] },
            { roles: ["third", "fifth", "fifth", "seventh"] },
            { roles: ["root", "third", "third", "root"] },
            { roles: ["root", "fifth", "root", "third"] },
            { roles: ["fifth", "root", "third", "fifth"] }
        ];

        function generateRandomVoice() {
            const mode = document.getElementById("randModeSelect").value;
            const selectedKey = document.getElementById("randKeySelect").value;
            const display = document.getElementById("voiceDisplay");

            if (!selectedKey) {
                document.getElementById("randomCondition").innerText = "【出題】上のプルダウンから調を選択してください";
                display.innerHTML = '<div style="color: #666; padding: 20px;">調を選ぶと問題が開始されます</div>';
                return;
            }

            const dataset = (mode === "dur") ? dataDur : dataMoll;
            const item = dataset[selectedKey];

            const chordIndices = [0, 1, 2, 3]; // I, IV, V7, I
            const chordIndex = chordIndices[Math.floor(Math.random() * chordIndices.length)];
            const chordObj = item.chords[chordIndex];

            // 属7 (V7) 以外は第4声部を空白にする対応
            let template;
            if (chordObj.name === "V7") {
                template = randomVoicingTemplates[Math.floor(Math.random() * randomVoicingTemplates.length)];
            } else {
                // 属7以外の場合、第4声部（インデックス3）を強制的にemptyにする
                let baseT = randomVoicingTemplates[Math.floor(Math.random() * randomVoicingTemplates.length)];
                template = { roles: [baseT.roles[0], baseT.roles[1], baseT.roles[2], "empty"] };
            }

            let roleToNotes = {};
            chordObj.voices.forEach(v => {
                if (v.role !== 'empty') {
                    if (!roleToNotes[v.role]) roleToNotes[v.role] = [];
                    roleToNotes[v.role].push(v.note);
                }
            });
            if (!roleToNotes["seventh"]) {
                roleToNotes["seventh"] = [chordObj.voices[3].note];
            }

            document.getElementById("randomCondition").innerText = 
                `【出題】 ${item.name} ＞ ${chordObj.name}和音`;

            document.getElementById("visualModeSelect").value = mode;
            document.getElementById("visualKeySelect").value = selectedKey;
            updateVisualTable();

            display.innerHTML = "";

            const partLabels = ["第1声部 (低)", "第2声部", "第3声部", "第4声部 (高)"];

            template.roles.forEach((role, idx) => {
                let card = document.createElement("div");
                if (role === 'empty') {
                    card.className = "voice-card role-empty";
                    card.innerHTML = `
                        <div class="voice-part">${partLabels[idx]}</div>
                        <div class="voice-note" style="color: #adb5bd;">-</div>
                        <div style="font-size:0.75rem; margin-top:4px;">[空白]</div>
                    `;
                } else {
                    let availableNotes = roleToNotes[role] || roleToNotes["root"];
                    let chosenNote = availableNotes[Math.floor(Math.random() * availableNotes.length)];
                    let germ = toGermanNote(chosenNote);

                    card.className = `voice-card ${getRoleClass(role)}`;
                    card.innerHTML = `
                        <div class="voice-part">${partLabels[idx]}</div>
                        <div class="voice-note">${germ} <span style="font-size:0.8rem;">(${chosenNote.replace('b','♭').replace('#','♯')})</span></div>
                        <div style="font-size:0.75rem; margin-top:4px;">[${getRoleLabel(role)}]</div>
                    `;
                }
                display.appendChild(card);
            });
        }

        function onRandSettingChange() {
            generateRandomVoice();
        }

        initKeySelects();
        updateVisualTable();
        generateRandomVoice();
    </script>
</body>
</html>
